<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Suscribirse - mlopezmad</title>
<link rel="stylesheet" href="style.css?v=363">
<script src="js/theme.js?v=12"></script>
</head>
<body>
<header class="site-header site-header--page">
    <a class="site-brand" href="index.html"><img class="brand-mark" src="assets/logo-mark.png" alt="" aria-hidden="true"><span>mlopezmad</span></a>
    <button class="mobile-menu-button mobile-menu-button--page" type="button" aria-expanded="false" aria-controls="mainNav">Menú</button>
    <nav class="site-nav site-nav--page" id="mainNav" aria-label="Navegación principal">
        <a href="index.html">Inicio</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="sobre-mi.html">Sobre mí</a>
        <a href="newsletter.html">Newsletter</a>
        <a class="nav-pill" href="contacto.html">Contacto</a>
    </nav>
</header>
<section class="page-hero page-hero--compact"><div><p class="eyebrow eyebrow--dark">Newsletter</p><h1>Suscribirse</h1><p>Recibe un correo cuando publique nuevas fotografías o proyectos personales.</p></div></section>
<section class="intro subscribe-page">
    <form action="https://buttondown.com/api/emails/embed-subscribe/mlopezmad" method="post" class="subscribe-form" target="hidden_iframe" onsubmit="mostrarConfirmacion()">
        <input type="email" name="email" placeholder="Tu correo electrónico" required>
        <input type="submit" value="Suscribirse">
    </form>
    <iframe name="hidden_iframe" style="display:none;"></iframe>
    <p class="subscribe-note" id="mensaje-suscripcion">Sin publicidad. Solo nuevas publicaciones.</p>
</section>
<footer class="site-footer"><span>© 2026 mlopezmad · Madrid, España</span><span>Newsletter</span></footer>
<script>
function mostrarConfirmacion(){
    const mensaje = document.getElementById("mensaje-suscripcion");
    const boton = document.querySelector('.subscribe-form input[type="submit"]');
    boton.value = "Enviando...";
    boton.disabled = true;
    setTimeout(() => {
        mensaje.textContent = "✓ Solicitud enviada. Revisa tu correo para confirmar la suscripción.";
        mensaje.classList.add("subscribe-success");
        boton.value = "Enviado";
    }, 500);
}
</script>
</body>
</html>
